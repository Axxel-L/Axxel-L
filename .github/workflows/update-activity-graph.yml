name: 📈 Graphique d'activité 2026

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        
      - name: 🐍 Générer le graphique via GraphQL
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_GRAPH_TOKEN }}
        run: |
          python3 -c "
          import requests, datetime, json, os, math
          from collections import defaultdict

          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'bearer {token}'}
          query = '''
          query(\$from: DateTime!, \$to: DateTime!) {
            viewer {
              contributionsCollection(from: \$from, to: \$to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          '''
          variables = {
            'from': '2026-01-01T00:00:00+00:00',
            'to': '2027-01-01T00:00:00+00:00'
          }
          r = requests.post('https://api.github.com/graphql',
                            json={'query': query, 'variables': variables},
                            headers=headers)
          if r.status_code != 200:
              print(f'Erreur GraphQL: {r.status_code} {r.text}')
              exit(1)
          data = r.json()
          if 'errors' in data:
              print(f'Erreur GraphQL: {data[\"errors\"]}')
              exit(1)

          calendar = data['data']['viewer']['contributionsCollection']['contributionCalendar']
          daily = defaultdict(int)
          for week in calendar['weeks']:
              for day in week['contributionDays']:
                  daily[day['date']] = day['contributionCount']

          start = datetime.date(2026, 1, 1)
          end = datetime.date.today()
          if end.year > 2026:
              end = datetime.date(2027, 1, 1) - datetime.timedelta(days=1)
          days = []
          d = start
          while d <= end:
              days.append(d.isoformat())
              d += datetime.timedelta(days=1)
          max_count = max(daily.values()) if daily else 1
          max_count = max(10, max_count)

          # Arrondir max_count pour un axe propre
          step = 1
          if max_count > 20: step = 5
          if max_count > 50: step = 10
          if max_count > 100: step = 25
          max_axe = math.ceil(max_count / step) * step

          width, height, margin_left, margin_right, margin_top, margin_bottom = 1200, 350, 80, 40, 40, 60
          plot_width = width - margin_left - margin_right
          plot_height = height - margin_top - margin_bottom
          bar_width = plot_width / len(days) if days else 1

          svg = [f'<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{width}\" height=\"{height}\">']
          svg.append('<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#ccc;font-size:12px}.title{font-size:18px;fill:#5bcdec;font-weight:600}.axe-line{stroke:#555;stroke-width:1}.bar-green{fill:#39d353}.bar-empty{fill:#2d333b}</style>')
          svg.append(f'<rect width=\"100%\" height=\"100%\" fill=\"#0d1117\"/>')

          # Axe Y : lignes horizontales + labels
          for val in range(0, max_axe + 1, step):
              y = margin_top + plot_height - (val / max_axe) * plot_height
              svg.append(f'<line x1=\"{margin_left}\" y1=\"{y}\" x2=\"{width-margin_right}\" y2=\"{y}\" class=\"axe-line\" stroke-dasharray=\"3,3\"/>')
              svg.append(f'<text x=\"{margin_left - 10}\" y=\"{y + 4}\" text-anchor=\"end\">{val}</text>')

          # Barres
          for i, date_str in enumerate(days):
              count = daily.get(date_str, 0)
              x = margin_left + i * bar_width
              bar_h = (count / max_axe) * plot_height if count > 0 else 0
              y = margin_top + plot_height - bar_h
              cls = 'bar-green' if count > 0 else 'bar-empty'
              svg.append(f'<rect x=\"{x}\" y=\"{y}\" width=\"{bar_width-1}\" height=\"{bar_h}\" class=\"{cls}\"/>')

          # Axe X
          svg.append(f'<line x1=\"{margin_left}\" y1=\"{margin_top + plot_height}\" x2=\"{width-margin_right}\" y2=\"{margin_top + plot_height}\" class=\"axe-line\"/>')

          # Titre
          svg.append(f'<text x=\"{width/2}\" y=\"28\" text-anchor=\"middle\" class=\"title\"></text>')

          # Mois
          for m in range(1, 13):
              date_obj = datetime.date(2026, m, 1)
              delta = (date_obj - start).days
              if delta < len(days):
                  x = margin_left + delta * bar_width
                  svg.append(f'<text x=\"{x}\" y=\"{margin_top + plot_height + 20}\" text-anchor=\"middle\">{date_obj.strftime(\"%b\")}</text>')

          svg.append('</svg>')
          with open('activity-graph.svg', 'w') as f:
              f.write('\\n'.join(svg))
          print('✅ Graphique 2026 avec axe Y généré.')
          "
      - name: 📤 Commiter et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          git diff --staged --quiet || (git commit -m "📊 Mise à jour du graphique annuel" && git push)
