name: 📈 Graphique d'activité 2026

on:
  schedule:
    - cron: '0 */6 * * *'  
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📊 Générer le graphique d'activité
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACTIVITY_GRAPH_TOKEN }}
          plugin_activity: yes
          plugin_activity_days: 365
          plugin_activity_visibility: all
          plugin_activity_filter: all
          plugin_activity_limit: 365
          base: ""
          filename: activity-graph.svg
          output_action: commit
          committer_branch: main
