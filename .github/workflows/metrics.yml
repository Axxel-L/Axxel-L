name: 📅 Calendrier de contributions 2026

on:
  schedule:
    - cron: '0 0 * * *'   # une fois par jour
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le calendrier
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACTIVITY_GRAPH_TOKEN }}
          plugin_isocalendar: yes
          plugin_isocalendar_days: 365
          base: ""
          filename: isocalendar.svg
          plugin_isocalendar_year: 2026
          config_timezone: Europe/Paris
          plugin_isocalendar_languages: fr
        continue-on-error: true

      - name: Commiter l'image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg
          git diff --staged --quiet || (git commit -m "📅 Mise à jour du calendrier 2026" && git push)
